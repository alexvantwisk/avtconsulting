name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.36"

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      # Offline mode checks only links to files inside _site, so the build
      # never depends on external hosts. --root-dir resolves root-relative
      # links such as /blog/index.xml. Redirect pages made by Quarto aliases
      # are JavaScript, so their existence is verified by the local checklist
      # (test -f), not by lychee.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --root-dir ${{ github.workspace }}/_site
            --exclude-mail
            --no-progress
            "_site/**/*.html"
          fail: true

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
