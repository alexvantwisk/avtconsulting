  page-footer:
    left: "© 2026 Alexander van Twisk"
    right:
      - icon: envelope
        href: "mailto:vantwiska@gmail.com"
        aria-label: "Email"
      - icon: linkedin
        href: "https://www.linkedin.com/in/alexander-van-twisk"
